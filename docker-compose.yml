name: langgraph-ops-agent

services:
  api:
    build: .
    container_name: ops-agent-api
    ports:
      - "8095:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OPS_INCIDENT_DIR: /data/incidents/INC-2026-11-06-01
      OPS_ENTERPRISE_DIR: /data
      OPS_RUNS_DIR: /app/runs
      OPS_CHECKPOINT_DB: /app/runs/checkpoints-docker.sqlite
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://langfuse.example.com}
    volumes:
      - ./data:/data:ro
      - ./runs:/app/runs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://0.0.0.0:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
